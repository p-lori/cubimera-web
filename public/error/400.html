<!doctype html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>400 — Cubimera</title>
  <meta name="description" content="Cubimera — 400 hibaoldal." />
  <script>try{if(localStorage.getItem('cubimera-theme')==='light'){document.documentElement.classList.add('light');}}catch(e){}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #050607; color: #f4f7f7;
      font-family: Inter, system-ui, sans-serif;
      min-height: 100vh; min-height: 100dvh;
      display: flex; text-align: center;
      padding: 56px 24px; overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }
    body::before {
      content: ""; position: fixed; inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,.045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.045) 1px, transparent 1px);
      background-size: 56px 56px;
      mask-image: radial-gradient(ellipse 90% 70% at 50% 30%, black 30%, transparent 75%);
      -webkit-mask-image: radial-gradient(ellipse 90% 70% at 50% 30%, black 30%, transparent 75%);
      pointer-events: none;
    }
    .scene { perspective: 700px; width: 120px; height: 120px; margin: 0 auto; }
    .cube { width: 120px; height: 120px; position: relative; transform-style: preserve-3d; animation: spin 14s linear infinite; }
    .cube div { position: absolute; inset: 0; border: 1.5px solid rgba(34,211,238,.85); background: rgba(34,211,238,.06); }
    @keyframes spin { from { transform: rotateX(-18deg) rotateY(0); } to { transform: rotateX(-18deg) rotateY(360deg); } }
    .eyebrow { margin-top: 32px; font-size: 12px; letter-spacing: .3em; color: #22d3ee; font-weight: 600; }
    h1 { font-family: "Space Grotesk", system-ui, sans-serif; font-size: clamp(96px, 22vw, 180px); line-height: 1; font-weight: 700; letter-spacing: -.04em; color: transparent; -webkit-text-stroke: 1.5px rgba(255,255,255,.75); margin-top: 8px; }
    h2 { font-family: "Space Grotesk", system-ui, sans-serif; font-size: clamp(28px, 5vw, 48px); letter-spacing: -.02em; margin-top: 4px; }
    h2 span { color: #22d3ee; }
    p { color: rgba(255,255,255,.55); margin-top: 16px; max-width: 420px; line-height: 1.6; }
    .btns { display: flex; gap: 16px; margin-top: 36px; flex-wrap: wrap; justify-content: center; }
    a { display: inline-flex; align-items: center; gap: 10px; padding: 16px 28px; border-radius: 999px; font-size: 14px; font-weight: 700; text-decoration: none; }
    a.primary { background: #22d3ee; color: #000; }
    a.primary:hover { filter: brightness(1.08); }
    a.ghost { border: 1px solid rgba(255,255,255,.15); background: rgba(255,255,255,.04); color: rgba(255,255,255,.9); }
    main { position: relative; margin: auto; display: flex; flex-direction: column; align-items: center; }
    html.light body { background: #eef2f3; color: #0b0e10; }
    html.light body::before { background-image: linear-gradient(rgba(11,14,16,.06) 1px, transparent 1px), linear-gradient(90deg, rgba(11,14,16,.06) 1px, transparent 1px); }
    html.light h1 { -webkit-text-stroke: 1.5px rgba(11,14,16,.8); }
    html.light h2 span { color: #0e7490; }
    html.light p { color: rgba(11,14,16,.6); }
    html.light a.ghost { border-color: rgba(11,14,16,.15); background: rgba(11,14,16,.04); color: rgba(11,14,16,.9); }
  </style>
</head>
<body>
  <main>
    <div class="scene">
      <div class="cube">
        <div style="transform: rotateY(0deg) translateZ(60px)"></div>
        <div style="transform: rotateY(90deg) translateZ(60px)"></div>
        <div style="transform: rotateY(180deg) translateZ(60px)"></div>
        <div style="transform: rotateY(-90deg) translateZ(60px)"></div>
        <div style="transform: rotateX(90deg) translateZ(60px)"></div>
        <div style="transform: rotateX(-90deg) translateZ(60px)"></div>
      </div>
    </div>
    <p class="eyebrow">CUBIMERA · HIBA</p>
    <h1>400</h1>
    <h2>Hibás kérés.</h2>
    <p>A kérés formátuma nem volt rendben. Ellenőrizd a címet, és próbáld újra.</p>
    <div class="btns">
      <a class="primary" href="/">Vissza a főoldalra</a>
      <a class="ghost" href="#" onclick="location.reload();return false;">Újrapróbálom</a>
    </div>
  </main>
</body>
</html>
